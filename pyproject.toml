[project]
name = "rag-fds"
version = "0.1.0"
description = "RAG local sobre Fichas de Datos de Seguridad (FDS) del sector de pinturas"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling",
    "pypdf",
    "chromadb",
    "ollama",
    "python-dotenv",
    "pandas",
    "torch",
    "torchvision",
    "psutil>=7.2.2",
    "ragas==0.4.4",
    "google-genai>=3.3.0",
    "numpy>=2.5.5",
]

# Docling corre en CPU: la GPU (6 GB) queda para Ollama y el disco libre es poco,
# y la rueda de torch con CUDA ocupa unos 4 GB más.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
